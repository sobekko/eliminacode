<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statistiche per mese - Eliminacode</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container stats-page">
      <header>
        <h1>Statistiche per mese</h1>
        <p>Ticket aggregati per mese.</p>
        <div class="admin-nav">
          <a class="admin-nav-link" href="/stat">Indice statistiche</a>
          <a class="admin-nav-link" href="/stat_totali">Totali</a>
        </div>
      </header>

      <section class="card">
        <h2>Seleziona mese</h2>
        <label for="stat-month-input" class="label">Mese</label>
        <input id="stat-month-input" type="month" />
      </section>

      <section class="card">
        <h2>Chiamate totali</h2>
        <div class="stats-grid">
          <div>
            <span class="label">Ticket chiamati</span>
            <strong id="stat-month-total">0</strong>
          </div>
          <div>
            <span class="label">Attesa media</span>
            <strong id="stat-month-attesa">0m 0s</strong>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Chiamate per servizio</h2>
        <ul id="stat-month-servizi" class="lista"></ul>
      </section>

      <section class="card">
        <h2>Chiamate per operatore</h2>
        <ul id="stat-month-operatori" class="lista"></ul>
      </section>
    </main>

    <script src="stat.js"></script>
  </body>
</html>
